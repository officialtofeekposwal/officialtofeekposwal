<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tofeek Poswal - Mobile Systems and Offline-First Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#121a3d"/>
      <stop offset="1" stop-color="#1c0f3f"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc">
        <animate attributeName="stop-color" values="#7dd3fc;#a78bfa;#f0abfc;#7dd3fc" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f0abfc;#7dd3fc;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetA" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </radialGradient>
    <radialGradient id="planetB" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f5d0fe"/>
      <stop offset="1" stop-color="#a855f7"/>
    </radialGradient>
    <radialGradient id="planetC" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#22c55e"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="320" rx="18" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="270" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="290" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="55" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="250" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="35" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="40" r="1.7"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="285" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="295" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="150" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="395" cy="170" r="1.0"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ORBIT SYSTEM (centre 730,160) -->
  <!-- outer orbit -->
  <g transform="rotate(-12 730 160)">
    <ellipse cx="730" cy="160" rx="170" ry="52" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 6"/>
    <circle r="9" fill="url(#planetA)" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" path="M560,160 a170,52 0 1,1 340,0 a170,52 0 1,1 -340,0"/>
    </circle>
  </g>
  <!-- middle orbit -->
  <g transform="rotate(24 730 160)">
    <ellipse cx="730" cy="160" rx="125" ry="38" fill="none" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle r="7" fill="url(#planetB)" filter="url(#glow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M605,160 a125,38 0 1,0 250,0 a125,38 0 1,0 -250,0"/>
    </circle>
  </g>
  <!-- inner orbit -->
  <g transform="rotate(-38 730 160)">
    <ellipse cx="730" cy="160" rx="82" ry="25" fill="none" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 5"/>
    <circle r="5" fill="url(#planetC)" filter="url(#glow)">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M648,160 a82,25 0 1,1 164,0 a82,25 0 1,1 -164,0"/>
    </circle>
  </g>
  <!-- core sun -->
  <circle cx="730" cy="160" r="40" fill="url(#sun)" opacity="0.85">
    <animate attributeName="r" values="36;46;36" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="160" r="15" fill="#fff7d6" filter="url(#glow)"/>

  <!-- TEXT -->
  <g>
    <text x="48" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="3">
      HI, I'M
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="46" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="url(#txt)" filter="url(#glow)">
      Tofeek Poswal
      <animate attributeName="opacity" from="0" to="1" dur="1.8s" fill="freeze"/>
    </text>
    <text x="48" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#cbd5e1" letter-spacing="1">
      Mobile Systems &#183; Offline-First &#183; Flutter &amp; Kotlin
      <animate attributeName="opacity" from="0" to="1" dur="2.4s" fill="freeze"/>
    </text>
    <rect x="48" y="242" width="0" height="3" rx="1.5" fill="url(#txt)">
      <animate attributeName="width" from="0" to="190" dur="2s" begin="0.8s" fill="freeze"/>
    </rect>
  </g>
</svg>
