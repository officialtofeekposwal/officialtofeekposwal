<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Super Apple Design card</title><desc id="d">Illustration: four stacked glass panes lifting one after another, one for each phase: direction, build, test and review.</desc>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1626"/><stop offset="1" stop-color="#0A1020"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset=".55" stop-color="#8B7CFF"/><stop offset="1" stop-color="#FF7A59"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter><clipPath id="cc"><rect x="1" y="1" width="1198" height="238" rx="40"/></clipPath></defs>
<style>.st{display:none}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}.tw{opacity:.5;animation:tw 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important}.mv{display:none}.st{display:inline}}@keyframes fillring{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}.fill{animation:fillring 12s ease-in-out infinite alternate}
@keyframes lift{0%,22%{transform:translateY(-12px);opacity:1}30%,100%{transform:none;opacity:.5}}
.pn{animation:lift 12s ease-in-out infinite both}
.pn2{animation-delay:3s}.pn3{animation-delay:6s}.pn4{animation-delay:9s}
</style>
